name: Test signing secrets

# Midlertidig workflow for å sjekke at EFM_GPG_PRIVATE_KEY og EFM_GPG_PASSPHRASE
# er den gjeldande kodesigneringsnøkkelen for eFormidling. Skal slettast etter bruk.
on:
  push:
    branches: [MOVE-5370]
    paths: [.github/workflows/test-signing-secrets.yaml]
  workflow_dispatch:

permissions: {}

jobs:
  test-signing-secrets:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_FINGERPRINT: AEF27AA6948A3856932AF98ECA5643393753ECE3
      PUBLIC_KEY_URL: https://docs.digdir.no/resources/eformidling/public_keys/eformidling-key.asc
    steps:
      - name: Inspect key, test passphrase and verify signature
        env:
          GPG_PRIVATE_KEY: ${{ secrets.EFM_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.EFM_GPG_PASSPHRASE }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::EFM_GPG_PRIVATE_KEY is empty or not available to this repo"; exit 1; }
          [ -n "$GPG_PASSPHRASE" ] || { echo "::error::EFM_GPG_PASSPHRASE is empty or not available to this repo"; exit 1; }

          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT

          echo "### 1. Nøkkelen i secret (kun offentleg info: fingeravtrykk, uid, utløpsdato)"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG --with-fingerprint

          if ! gpg --list-secret-keys --with-colons | grep -q "^fpr:::::::::$SIGNING_KEY_FINGERPRINT:"; then
            echo "::error::Secret inneheld ikkje nøkkelen $SIGNING_KEY_FINGERPRINT"
            exit 1
          fi
          EXPIRES=$(gpg --list-secret-keys --with-colons "$SIGNING_KEY_FINGERPRINT" | awk -F: '$1=="sec"{print $7; exit}')
          echo "Utløpsdato i secret: ${EXPIRES:+$(date -u -d "@$EXPIRES" +%F)}${EXPIRES:-aldri}"

          echo "### 2. Test passord ved å signere ei testfil"
          echo "test $(date -u)" > test.txt
          if ! gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                 --local-user "$SIGNING_KEY_FINGERPRINT" --detach-sign --armor test.txt; then
            echo "::error::Signering feila: feil passord, eller nøkkelen i secret er utgått"
            exit 1
          fi
          echo "Passordet er rett"

          echo "### 3. Verifiser mot publisert nøkkel (som i release-workflowen)"
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          curl --fail --silent --show-error --location -o eformidling-key.asc "$PUBLIC_KEY_URL"
          gpg --batch --import eformidling-key.asc
          gpg --batch --status-fd 1 --verify test.txt.asc test.txt | tee verify.out
          grep -q "^\[GNUPG:\] GOODSIG " verify.out || { echo "::error::Signaturen er ikkje gyldig mot publisert nøkkel"; exit 1; }
          ACTUAL=$(awk '$2 == "VALIDSIG" {print $3}' verify.out)
          [ "$ACTUAL" = "$SIGNING_KEY_FINGERPRINT" ] || { echo "::error::Feil fingeravtrykk: '$ACTUAL'"; exit 1; }
          echo "✅ Secrets er gyldige: rett nøkkel, rett passord, og signaturen verifiserer mot publisert nøkkel"
