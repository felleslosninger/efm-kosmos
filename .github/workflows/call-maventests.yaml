name: Run maven tests

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  call-workflow-maven-build:
    uses: felleslosninger/github-workflows/.github/workflows/ci-pr-checks-lib.yml@main
    with:
      java-version: 21
      maven-lifecycle: verify
    secrets: inherit
